<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>무한 점프</title>
<meta name="theme-color" content="#0B0A1F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="../../assets/icons/endless-jump-192.png">
<link rel="apple-touch-icon" href="../../assets/icons/endless-jump-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="무한 점프">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700&display=swap">
<style>
  html, body { margin: 0; height: 100%; background: #0B0A1F; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  .bar { position: fixed; top: max(10px, env(safe-area-inset-top)); left: 10px; display: flex; gap: 8px; z-index: 5; }
  .bar a, .bar button { min-height: 44px; display: inline-flex; align-items: center; gap: 6px; padding: 0 16px; border: 1px solid rgba(255,255,255,.22); border-radius: 999px; background: rgba(20,18,48,.6); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); color: #F4F2FF; font: 15px "Black Han Sans", sans-serif; text-decoration: none; cursor: pointer; }
  .bar button { background: linear-gradient(135deg, #7B5CFF, #FF3DA8); border-color: transparent; box-shadow: 0 0 18px rgba(255,61,168,.45); }
  .bar [hidden] { display: none; }
</style>
</head>
<body>
<iframe sandbox="allow-scripts" src="../../games/endless-jump/index.html" title="무한 점프"></iframe>
<div class="bar">
  <a href="../../index.html#/game/endless-jump" aria-label="놀이터로 가기">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11 12 4l8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>놀이터
  </a>
  <button id="install" hidden>앱 설치</button>
</div>
<script type="module">
  // 게임별 홈 화면 런처 — 열리자마자 풀스크린으로 게임 실행, 저장은 놀이터와 같은 저장소 사용
  import { createHost } from '../../js/host.js';
  import { checkIn } from '../../js/store.js';
  checkIn();
  const iframe = document.querySelector('iframe');
  createHost({ iframe, slug: 'endless-jump' });
  iframe.addEventListener('load', () => iframe.focus());

  // 앱처럼 실행 중이면 놀이터 버튼을 작게 숨김
  const standalone = matchMedia('(display-mode: standalone), (display-mode: fullscreen)').matches || navigator.standalone;
  const bar = document.querySelector('.bar');
  if (standalone) bar.style.opacity = '.55';

  // 안드로이드 크롬: 설치 창
  let deferred = null;
  const btn = document.getElementById('install');
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; btn.hidden = false; });
  btn.addEventListener('click', async () => {
    if (!deferred) return;
    deferred.prompt();
    await deferred.userChoice.catch(() => {});
    deferred = null; btn.hidden = true;
  });
  window.addEventListener('appinstalled', () => { btn.hidden = true; });
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('../../sw.js', { scope: '../../' }).catch(() => {});
</script>
</body>
</html>
